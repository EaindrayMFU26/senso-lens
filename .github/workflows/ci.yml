name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.email "ci@senso-lens.local"
          git config --global user.name "SENSO CI"
          git config --global init.defaultBranch main
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Test
        run: pytest -q
      - name: Smoke test on this repository
        run: |
          senso init . --scale weekly
          senso status .
          senso explain .
